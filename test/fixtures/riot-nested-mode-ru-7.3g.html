в</h4><h5>Шепчущая диадема / Диадема песен</h5><ul><li>Коэффициент преобразования максимальной маны в эффективность лечения и щитов: 0,25% → 0,18%&nbsp;</li></ul><h5>Преимущество Дюрана</h5><ul><li>Сила атаки: 25 → 40</li></ul><h5>Доспех Вармога</h5><p>Нам хочется, чтобы у танков было больше предметов, увеличивающих здоровье, помимо Кольчуги дельца. Мы усилили Доспех Вармога и Исходное Сердце стали, чтобы разнообразить сборки для танков.</p><ul><li>Максимальный запас здоровья: 900 → 1200</li><li>Перезарядка пассивного эффекта Сердца Вармога: 15 сек. → 10 сек.</li></ul><h5>Расплата Атмы</h5><ul><li>Шанс критического удара за каждые 100 ед. здоровья: 1% → 1,5%</li><li>Максимальный бонус к шансу критического удара: 30% → 45%</li></ul><h5>Исходное Сердце стали</h5><ul><li>Урон от рывка: 140 + 3,5% от максимального запаса здоровья → 140 + 5% от максимального запаса здоровья</li></ul><h5>Эфемерное оружие</h5><ul><li>Дальность деактивации: 15 → 25</li></ul>"}}]}}}}</script>
