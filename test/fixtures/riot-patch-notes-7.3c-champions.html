<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://wildrift.leagueoflegends.com/ru-ru/news/game-updates/wild-rift-patch-notes-7-3c/","blades":[{"type":"articleMasthead","title":"Описание обновления 7.3c для Wild Rift","publishDate":"2026-10-21T09:00:00.000Z"},{"palette":"palette2","richText":{"type":"html","body":"<p>В \"AAA ARAM\" продолжает царить хаос! В этом обновлении арсенал аугментаций пополнится новинками, в числе которых – \"Арт-панки\", \"Быстрая реакция\" и несколько знакомых фаворитов. Кроме того, мы уделили внимание отстающим аугментациям, ослабили чересчур сильные варианты и скорректировали чемпионов, которым требовалась помощь (или с которых нужно было слегка сбить спесь). Ищете ли вы идеальное комбо аугментаций или просто хотите как следует повеселиться, вам будет с чем поэкспериментировать. А теперь обо всем подробнее.</p><p><i>Напоминание: контент будет выходить на протяжении всего цикла обновления.</i></p>"},"type":"articleRichText"},{"palette":"palette2","richText":{"type":"html","body":"<h2>ИЗМЕНЕНИЯ ИГРОВЫХ РЕЖИМОВ</h2><h3>ААА ARAM</h3><h4>Новые аугментации</h4><ul><li>\"Арт-панки\"</li><li>\"Профи Аркады\" и соответствующие особые сюрпризы также станут доступны после выхода обновления.&nbsp;</li><li>\"Быстрая реакция\"</li><li>\"Возвращение к основам\"</li><li>\"Исток: Хватка нежити\"</li></ul><h4>Изменения аугментаций</h4><h5>Металлическая корона</h5><ul><li>Теперь перезарядка \"Металлической короны\" – 20 сек.</li></ul><h5>Маяк даркинов</h5><ul><li>Перезарядка: 0,2 сек. → 0 сек.</li></ul><h5>Хекстек-шрапнель</h5><ul><li>Дополнительный урон после преобразования: 30% → 50%</li></ul><h5>Боевой арсенал</h5><ul><li>Шанс срабатывания дополнительного урона от предмета: 40% → 60%</li></ul><h5>Касание погибели</h5><ul><li>Дополнительный урон, преобразуемый каждую секунду с помощью умений: 12% → 15%</li></ul><h5>Дуэт</h5><ul><li>Дополнительный чистый урон после выхода из скрытности: 30–90 + 30% от дополнительной силы атаки + 10% от силы умений → 60–150 + 50% от дополнительной силы атаки + 20% от силы умений&nbsp;</li></ul><h5>Венец превосходства</h5><ul><li>Лимит критического урона: 400% → 444%&nbsp;</li></ul><h5>Украдкой</h5><ul><li>Период действия дополнительного урона после выхода из скрытности: 0,1 сек. → 0,5 сек.</li><li>Урон, используемый для расчета дополнительного урона: урон после применения защитных показателей → урон до применения защитных показателей</li></ul><h5>Клинок и тень</h5><ul><li>Урон: 30–90 + 10% от силы атаки + 25% от силы умений → 30–120 + 20% от силы атаки + 40% от силы умений</li></ul><h5>Медленное ослабление</h5><ul><li>Броня и сопротивление магии за каждые 10 ед. дополнительной скорости передвижения: 1,5 → 2&nbsp;</li></ul><h5>Двойная гармония, Фокус с исчезновением</h5><ul><li>Теперь могут активировать аугментации, связанные с передвижением, например \"Песчаную бурю\".&nbsp;</li></ul><h2>Изменения чемпионов</h2><h5>Джарван&nbsp;IV</h5><ul><li>Наносимый урон: 105% → 100%</li><li>Получаемый урон: 95% → 100%</li></ul><h5>Талия</h5><ul><li>Наносимый урон: 100% → 110%</li></ul><h5>Райз</h5><ul><li>Получаемый урон: 100% → 90%</li></ul><h5>Каин</h5><ul><li>Наносимый урон: 95% → 105%</li></ul><h5>Владимир</h5><ul><li>Наносимый урон: 90% → 100%</li><li>Получаемый урон: 110% → 105%</li></ul>"},"type":"articleRichText"}]}}}}</script>
