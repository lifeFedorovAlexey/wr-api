name: wildrift-worker
services:
  worker:
    image: ${WORKER_IMAGE:?set pinned worker image}
    env_file: ./secrets/worker.env
    environment:
      SCRAPE_REVISION: ${SCRAPE_REVISION:?set source revision}
      ASSET_PUBLIC_MODE: s3
      DATABASE_POOL_MAX: 3
      GUIDE_ASSETS_DIR: /tmp/wr-assets/guides
      GUIDE_HERO_MEDIA_DIR: /tmp/wr-assets/hero
      CHAMPION_ICONS_DIR: /tmp/wr-assets/icons
      CN_FETCH_TIMEOUT_MS: 30000
      CN_FETCH_RETRIES: 5
      RIFTGG_REQUEST_TIMEOUT_MS: 20000
      RIFTGG_FETCH_RETRIES: 2
      PATCH_NOTES_REQUEST_TIMEOUT_MS: 30000
      PATCH_NOTES_FETCH_RETRIES: 3
    read_only: true
    init: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:size=384m,mode=1777
      - /app/ui/data:size=128m,uid=10001,gid=10001
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
  observer:
    image: ${WORKER_IMAGE:?set pinned worker image}
    env_file: ./secrets/worker.env
    command: ['--status', '--output', '/state/database-status.json']
    read_only: true
    init: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    volumes: ['/srv/data/wildrift-worker:/state']
    tmpfs: ['/tmp:size=8m,mode=1777']
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}
