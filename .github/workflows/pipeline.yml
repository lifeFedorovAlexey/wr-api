name: API Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy API after checks
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "45 4 * * 1"

concurrency:
  group: api-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency and license changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Security Audit
    uses: ./.github/workflows/security-audit.yml

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  deploy:
    name: Deploy API To Timeweb
    needs:
      - ci
      - security
      - codeql
      - dependency-review
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.security.result == 'success' &&
      needs.codeql.result == 'success' &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    uses: ./.github/workflows/deploy-timeweb.yml
    secrets: inherit
