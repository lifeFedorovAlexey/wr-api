name: Provision kolvrt worker
on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Base64 encoded RSA public PEM generated on kolvrt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: provision-kolvrt-worker
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0
      - run: npm ci --omit=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Provision scoped database roles and encrypt credentials
        run: node scripts/provision-scrape-worker.mjs
        env:
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kolvrt-worker-envelope
          path: worker-envelope.json
          retention-days: 1
          if-no-files-found: error
