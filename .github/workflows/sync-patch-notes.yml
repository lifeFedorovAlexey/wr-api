name: Sync Patch Notes

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Explicitly import now even when the last successful check is fresh
        type: boolean
        default: false

concurrency:
  group: sync-patch-notes
  cancel-in-progress: false

jobs:
  fallback:
    uses: ./.github/workflows/scrape-fallback.yml
    with:
      jobs: patch-notes
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets: inherit
