name: Sync Patch Notes

on:
  schedule:
    - cron: "12,42 * * * *"
    - cron: "41 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["API Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: sync-patch-notes
  cancel-in-progress: false

jobs:
  fallback:
    if: vars.KOLVRT_PRIMARY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '12,42 * * * *' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    uses: ./.github/workflows/scrape-fallback.yml
    with:
      jobs: patch-notes
      force: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
      expected_api_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    secrets: inherit
  sync:
    if: >-
      vars.KOLVRT_PRIMARY_ENABLED != 'true' && github.event.schedule != '12,42 * * * *' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_POOL_MAX: 2
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
      ASSET_PUBLIC_MODE: ${{ secrets.ASSET_PUBLIC_MODE }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PATCH_NOTES_REQUEST_TIMEOUT_MS: 30000
      PATCH_NOTES_FETCH_RETRIES: 3
    steps:
      - name: Checkout API repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure database and S3 secrets are present
        shell: bash
        run: |
          required=(DATABASE_URL S3_ENDPOINT S3_BUCKET S3_PUBLIC_BASE_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "Missing required workflow secrets: ${missing[*]}" >&2
            exit 1
          fi

          if [[ "${ASSET_PUBLIC_MODE,,}" != "s3" ]]; then
            echo "ASSET_PUBLIC_MODE must be s3 for public patch-note asset URLs" >&2
            exit 1
          fi

      - name: Ensure patch notes schema exists
        run: npm run setup:patch-notes

      - name: Import English, then Russian patch notes
        run: npm run sync:patch-notes

      - name: Mirror missing patch item and rune icons to S3
        run: npm run sync:patch-note-fallback-assets

      - name: Mirror missing patch skin artwork to S3
        run: npm run sync:patch-note-skin-assets -- --apply --update-db
