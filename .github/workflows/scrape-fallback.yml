name: Coordinated scrape worker
on:
  workflow_call:
    inputs:
      jobs:
        type: string
        required: true
      force:
        type: boolean
        default: false
      slugs:
        type: string
        default: ''
      expected_api_sha:
        description: API deployment commit that a post-deploy import must match
        type: string
        default: ''
    secrets:
      DATABASE_URL: {required: true}
      S3_ENDPOINT: {required: true}
      S3_BUCKET: {required: true}
      S3_PUBLIC_BASE_URL: {required: true}
      S3_FORCE_PATH_STYLE: {required: false}
      S3_ACCESS_KEY_ID: {required: true}
      S3_SECRET_ACCESS_KEY: {required: true}
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_POOL_MAX: 3
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      ASSET_PUBLIC_MODE: s3
      GUIDE_ASSETS_DIR: /tmp/wr-runtime/guide-assets
      GUIDE_HERO_MEDIA_DIR: /tmp/wr-runtime/guide-hero-media
      CHAMPION_ICONS_DIR: /tmp/wr-runtime/champion-icons
      CN_FETCH_TIMEOUT_MS: 30000
      CN_FETCH_RETRIES: 5
      RIFTGG_REQUEST_TIMEOUT_MS: 20000
      RIFTGG_FETCH_RETRIES: 2
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Require matching pinned scraper versions
        shell: bash
        env:
          API_REF: ${{ vars.KOLVRT_API_REF }}
          UI_REF: ${{ vars.KOLVRT_UI_REF }}
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
        run: |
          for name in API_REF UI_REF; do
            if [[ ! "${!name}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "KOLVRT_${name} must contain the full commit SHA deployed on kolvrt" >&2
              exit 1
            fi
          done
          if [[ -n "$EXPECTED_API_SHA" && "${API_REF,,}" != "${EXPECTED_API_SHA,,}" ]]; then
            echo "Post-deploy import stopped: update the kolvrt image and both pinned refs together before importing with the new API revision" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lifeFedorovAlexey/wildriftchampionsData
          ref: ${{ vars.KOLVRT_UI_REF }}
          path: app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app/wr-api
          ref: ${{ vars.KOLVRT_API_REF }}
      - name: Record and verify the checked out scraper revision
        shell: bash
        env:
          API_REF: ${{ vars.KOLVRT_API_REF }}
          UI_REF: ${{ vars.KOLVRT_UI_REF }}
        run: |
          api_sha="$(git -C app/wr-api rev-parse HEAD)"
          ui_sha="$(git -C app rev-parse HEAD)"
          if [[ "$api_sha" != "${API_REF,,}" || "$ui_sha" != "${UI_REF,,}" ]]; then
            echo "Checked out source differs from the pinned kolvrt versions" >&2
            exit 1
          fi
          echo "SCRAPE_REVISION=$api_sha" >> "$GITHUB_ENV"
          echo "Scraper source: API $api_sha; UI $ui_sha"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/wr-api/package-lock.json
      - run: npm ci --omit=dev
        working-directory: app
      - run: npm ci --omit=dev
        working-directory: app/wr-api
      - name: Run only due jobs under the shared database lock
        working-directory: app/wr-api
        env:
          SCRAPE_JOBS: ${{ inputs.jobs }}
          SCRAPE_FORCE: ${{ inputs.force }}
          SCRAPE_SLUGS: ${{ inputs.slugs }}
        shell: bash
        run: |
          args=(--executor github --fallback --jobs "$SCRAPE_JOBS" --slugs "$SCRAPE_SLUGS")
          if [[ "$SCRAPE_FORCE" == "true" ]]; then args+=(--force); fi
          node scripts/scrape-worker.mjs "${args[@]}"
