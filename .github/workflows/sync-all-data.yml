name: Sync All Data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        type: choice
        default: full
        options:
          - champions-history
          - champions-history-riftgg
          - guides
          - full
      slugs:
        description: Optional champion slugs; requires force
        required: false
        type: string
        default: ""
      force:
        description: Explicitly import now even when the last successful check is fresh
        type: boolean
        default: false

concurrency:
  group: sync-all-data
  cancel-in-progress: false

jobs:
  fallback:
    uses: ./.github/workflows/scrape-fallback.yml
    with:
      jobs: ${{ github.event_name != 'workflow_dispatch' && 'stats,riftgg,guides' || inputs.mode == 'champions-history' && 'stats' || inputs.mode == 'champions-history-riftgg' && 'stats,riftgg' || inputs.mode == 'guides' && 'guides' || 'stats,riftgg,guides' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      slugs: ${{ inputs.slugs || '' }}
    secrets: inherit
